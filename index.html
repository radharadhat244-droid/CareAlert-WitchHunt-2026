<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareAlert</title>
<link rel="stylesheet" href="style.css">
<style>
  .splash { background: #2D5016; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .splash h1 { color: white; font-size: 42px; margin-top: 10px; }
  .splash p { color: #8BC34A; font-size: 18px; margin-top: 8px; }
  .lang-page { padding: 30px 20px; }
  .lang-page h2 { color: #2D5016; font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 24px; line-height: 1.5; }
  .lang-btn { display: block; width: 100%; padding: 16px; margin-bottom: 12px; background: #2D5016; color: white; border: none; border-radius: 14px; font-size: 19px; font-weight: bold; cursor: pointer; text-align: center; }
  .note { text-align: center; color: #aaa; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>

<div class="splash" id="splash">
  <span style="font-size:60px">🌿</span>
  <h1>CareAlert</h1>
  <p>Your Care Companion</p>
</div>

<div class="lang-page" id="langPage" style="display:none">
  <div style="text-align:center;margin-bottom:20px">
    <span style="font-size:40px">🌿</span>
    <h2>Choose Your Language<br>ಭಾಷೆ ಆಯ್ಕೆ ಮಾಡಿ<br>भाषा चुनें</h2>
  </div>
  <button class="lang-btn" onclick="go('en')">🇮🇳 English</button>
  <button class="lang-btn" onclick="go('kn')">🇮🇳 ಕನ್ನಡ (Kannada)</button>
  <button class="lang-btn" onclick="go('hi')">🇮🇳 हिंदी (Hindi)</button>
  <button class="lang-btn" onclick="go('ta')">🇮🇳 தமிழ் (Tamil)</button>
  <button class="lang-btn" onclick="go('te')">🇮🇳 తెలుగు (Telugu)</button>
  <button class="lang-btn" onclick="go('ml')">🇮🇳 മലയാളം (Malayalam)</button>
  <p class="note">You can change this later in Settings</p>
</div>

<script>
setTimeout(() => {
  document.getElementById('splash').style.display = 'none';
  document.getElementById('langPage').style.display = 'block';
}, 2000);
function go(lang) {
  localStorage.setItem('lang', lang);
  window.location.href = 'home.html';
}
</script>
</body>
</html>
